name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/website/**'
      - 'apps/docs/**'
      - 'packages/ui/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      # ===== 1. 构建 UI 物料库 =====
      - name: Install & Build UI packages
        working-directory: packages/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec nx run-many --target=build --projects=luban-base,luban-low-code

      # ===== 2. 构建 Landing Page（Nuxt 静态） =====
      - name: Build Landing Page
        working-directory: apps/website
        run: |
          pnpm install --frozen-lockfile
          mv app/router.options.ts app/router.options.ts.bak 2>/dev/null || true
          mv router/routes.ts router/routes.ts.bak 2>/dev/null || true
          mv views/Home.vue views/Home.vue.bak 2>/dev/null || true
          NODE_ENV=production npx nuxi generate
          # nuxi generate 有时不拷贝 _nuxt 客户端资源，手动补
          cp -r .nuxt/dist/client/_nuxt .output/public/_nuxt 2>/dev/null || true
          mv app/router.options.ts.bak app/router.options.ts 2>/dev/null || true
          mv router/routes.ts.bak router/routes.ts 2>/dev/null || true
          mv views/Home.vue.bak views/Home.vue 2>/dev/null || true

      # ===== 3. 构建文档站（VitePress） =====
      - name: Build Docs Site
        working-directory: apps/docs
        run: |
          pnpm install --frozen-lockfile
          NODE_ENV=production npx vitepress build

      # ===== 4. 构建 Storybook（静态） =====
      - name: Build Storybook
        working-directory: packages/ui
        run: |
          NODE_ENV=production pnpm exec storybook build -o ../../storybook-static

      # ===== 5. 合并到单一部署目录 =====
      - name: Assemble deploy directory
        run: |
          mkdir -p _site
          # Landing page → _site/
          cp -r apps/website/.output/public/* _site/
          # Docs → _site/docs/
          mkdir -p _site/docs
          cp -r apps/docs/.vitepress/dist/* _site/docs/
          # Storybook → _site/storybook/
          mkdir -p _site/storybook
          cp -r storybook-static/* _site/storybook/
          # .nojekyll to disable Jekyll processing
          touch _site/.nojekyll
          echo "Deploy directory assembled:"
          du -sh _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
