# =====================================================================
# luban 子域反代 — 挂到 gudu-nginx 的 conf.d（与 app-http.conf 同目录，互不影响）
# 由 docker-compose.prod.yml 的 luban-* 容器（挂 gudu_default 网络）接收。
# 安装：scp 到 /root/gudu/nginx/conf.d/luban.conf 后 docker exec gudu-nginx nginx -s reload
# ---------------------------------------------------------------------
# 当前：仅 HTTP（listen 80），DNS/证书就绪后在对应 server 块补 listen 443 ssl + 证书路径。
# =====================================================================

# ---------- 通用反代片段（WebSocket 友好）----------
# 各 server 直接写 proxy_set_header，避免 include 依赖。

# ---------- website（官网/SSR）----------
server {
    listen 80;
    server_name luban.xiaoshuai1024.top;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://luban-website:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------- manage（低代码引擎/设计器）----------
server {
    listen 80;
    server_name manage.xiaoshuai1024.top;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://luban-manage:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------- api（backend Java；/healthz → /backend/healthz）----------
server {
    listen 80;
    server_name api.xiaoshuai1024.top;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location = /healthz {
        proxy_pass http://luban-backend:8080/backend/healthz;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://luban-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- bff（Node）----------
server {
    listen 80;
    server_name luban-bff.xiaoshuai1024.top;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://luban-bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
