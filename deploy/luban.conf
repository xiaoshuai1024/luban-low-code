# =====================================================================
# luban 子域反代 — 挂到 gudu-nginx 的 conf.d（与 app-http.conf 同目录，互不影响）
# 由 docker-compose.prod.yml 的 luban-* 容器（挂 gudu_default 网络）接收。
# 安装：bash deploy-prod.sh edge（scp → gudu-nginx nginx -t 安全门 → reload）
# ---------------------------------------------------------------------
# 4 子域 A 记录 49.232.3.201（灰云直连），Let's Encrypt 4-SAN 证书：
#   /etc/letsencrypt/live/luban.xiaoshuai1024.top/{fullchain,privkey}.pem
# 续期由 gudu-certbot renew 循环 + renewal-hooks/deploy reload gudu-nginx。
# =====================================================================

# ---------- website（官网/SSR）----------
server {
    listen 80;
    server_name luban.xiaoshuai1024.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name luban.xiaoshuai1024.top;
    ssl_certificate     /etc/letsencrypt/live/luban.xiaoshuai1024.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luban.xiaoshuai1024.top/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:lubanSSL:10m;

    location / {
        proxy_pass http://luban-website:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

