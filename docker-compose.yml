# Luban 全栈部署编排（开发环境）
#
# 用法：
#   1. 复制 .env.dev.example → .env.dev，按需修改敏感值
#   2. docker compose --env-file .env.dev up -d --build
#   3. docker compose down
#
# 服务拓扑：mysql/redis（自建）→ backend-java → bff → engine(设计器) + website(渲染) + ai-assistant
# 注：Go 后端已弃用（原 Java/Go 双后端 → 单后端 Java），不在部署清单。
#
# 端口（宿主:容器）：
#   mysql     ${MYSQL_HOST_PORT:-3306}:3306
#   redis     ${REDIS_HOST_PORT:-6379}:6379
#   backend   8080  (context-path /backend；健康检查 /backend/actuator/health)
#   bff       3100
#   engine    4200  (nginx 静态托管；/api proxy → bff:3100)
#   website   3000  (nuxt SSR，容器内监听 4173)
#   ai        8000  (FastAPI；profiles: ai，默认不起)
#
# 构建说明（monorepo）：
#   engine/website 需要 workspace 依赖（ui packages），build context 为仓库根（.），
#   通过 .dockerignore 排除 node_modules / 构建产物加速。bff / backend-java 自包含。

services:
  mysql:
    image: mysql:8.0
    env_file: .env.dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-luban}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luban}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - luban-mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-luban}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-java:
    build:
      context: ./apps/backend-java
    env_file: .env.dev
    environment:
      APP_PORT: "8080"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DATABASE:-luban}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-luban}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bff:
    build:
      context: ./apps/bff
    env_file: .env.dev
    environment:
      # 单后端：仅指向 Java（Go 后端已弃用）
      BACKEND_BASE_URL: http://backend-java:8080/backend
      PORT: "3100"
    ports:
      - "3100:3100"
    depends_on:
      - backend-java
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    env_file: .env.dev
    environment:
      # nginx proxy /api → bff:3100，见 nginx-manage.conf
      VITE_BFF_BASE_URL: http://bff:3100
    ports:
      - "4200:4200"
    depends_on:
      - bff
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    env_file: .env.dev
    environment:
      NUXT_PUBLIC_BFF_BASE_URL: http://bff:3100
      NUXT_PUBLIC_DEFAULT_SITE_SLUG: ${DEFAULT_SITE_SLUG:-default}
      # Nuxt Nitro 默认监听 4173；compose 映射 3000:4173
      NITRO_PORT: "4173"
      PORT: "4173"
    ports:
      - "3000:4173"
    depends_on:
      - bff
    restart: unless-stopped

  ai-assistant:
    build:
      context: ./packages/ai-assistant
    env_file: .env.dev
    environment:
      POSTGRES_DSN: postgresql://luban:luban@ai-postgres:5432/luban_ai
      QDRANT_HOST: ai-qdrant
      QDRANT_PORT: "6333"
    ports:
      - "8002:8000"
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-qdrant:
        condition: service_started
    restart: unless-stopped
    # 规划中：默认不启动，显式 --profile ai 才起
    profiles: ["ai"]

  # AI 助手依赖（仅 --profile ai 时启动）
  ai-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: luban
      POSTGRES_PASSWORD: luban
      POSTGRES_DB: luban_ai
    volumes:
      - ai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luban -d luban_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["ai"]

  ai-qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ai-qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    profiles: ["ai"]

volumes:
  luban-mysql:
  ai-pgdata:
  ai-qdrantdata:
