name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/website/**'
      - 'packages/ui/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install root dependencies
        working-directory: ./
        run: pnpm install --frozen-lockfile

      - name: Build UI packages
        working-directory: packages/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec nx run-many --target=build --projects=luban-base,luban-low-code

      - name: Build website (static generate)
        working-directory: apps/website
        run: |
          pnpm install --frozen-lockfile
          # Temporarily disable custom SSR router so pages/index.vue is used
          mv app/router.options.ts app/router.options.ts.bak 2>/dev/null || true
          mv router/routes.ts router/routes.ts.bak 2>/dev/null || true
          npx nuxi generate
          # Restore custom router for SSR app
          mv app/router.options.ts.bak app/router.options.ts 2>/dev/null || true
          mv router/routes.ts.bak router/routes.ts 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
