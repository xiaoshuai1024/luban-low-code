name: E2E Cross-project

# 跨项目流程性 E2E（发布闭环 / 线索闭环）
# 测试失败必须阻断合入（仓库硬约束：E2E 禁止跳过/假绿）

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  cross-e2e:
    name: Cross-project E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check e2e prerequisites
        run: |
          test -f docker-compose.e2e.yml || { echo "::error::docker-compose.e2e.yml 缺失"; exit 1; }
          test -d e2e || { echo "::error::e2e 目录缺失"; exit 1; }

      - name: Install workspace deps (root)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: pnpm run install:e2e:ci

      - name: Start service stack
        run: make e2e-up

      - name: Run cross-project E2E
        env:
          LUBAN_E2E_USE_PLAYWRIGHT_CHROMIUM: "1"
          LUBAN_E2E_ENGINE_URL: http://127.0.0.1:4200
          LUBAN_E2E_WEBSITE_URL: http://127.0.0.1:3000
          LUBAN_E2E_JAVA_API: http://127.0.0.1:8080
          LUBAN_E2E_BFF_URL: http://127.0.0.1:3100
          # 与 docker-compose.e2e.yml 的 E2E_BOOTSTRAP_* 同值（栈为全新临时库，自建账号）
          LUBAN_E2E_ACCOUNT: e2e-ci
          LUBAN_E2E_PASSWORD: e2e-ci-pass-2026
        working-directory: e2e
        run: pnpm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Stop service stack
        if: always()
        run: make e2e-down
