# ---------- api（backend Java；/healthz → /backend/healthz）----------
server {
    listen 80;
    server_name api.xiaoshuai1024.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.xiaoshuai1024.top;
    ssl_certificate     /etc/letsencrypt/live/luban.xiaoshuai1024.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luban.xiaoshuai1024.top/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:lubanSSL:10m;

    location = /healthz {
        proxy_pass http://luban-backend:8080/backend/healthz;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://luban-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

